[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerostruct15mw"
version = "1.0.0"
description = "Reduced-order aero-structural analysis and surrogate-assisted optimization for the IEA 15-MW reference wind turbine blade."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Shreyas C G"}
]
keywords = [
  "wind-energy",
  "offshore-wind",
  "BEM",
  "finite-element-method",
  "machine-learning",
  "optimization"
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "paretoset>=1.2.5"
]

[project.urls]
Repository = "https://github.com/shreyas-chandhavar/AeroStruct-15MW"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
